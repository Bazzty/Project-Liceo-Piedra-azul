version: 2
updates:
  # Herramientas del repositorio (husky, commitlint)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: develop
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: develop
  # Agregar al instalar tecnologías (fase 3):
  #   npm       -> /frontend
  #   composer  -> /backend
