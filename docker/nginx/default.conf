server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Generar un audio puede esperar a ElevenLabs (20 s) y después a Piper y lame (60 s + 30 s).
        # Un borrador de cuento puede tardar hasta OLLAMA_ESPERA (90 s) en un servidor sin GPU.
        fastcgi_read_timeout 120s;
    }

    # .env, .git y similares nunca se sirven (el punto de .well-known sí).
    location ~ /\.(?!well-known) {
        deny all;
    }
}
